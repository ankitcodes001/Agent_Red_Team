[project]
name = "agent-red-team"
version = "0.1.0.dev0"
description = "Offensive-security agent that red-teams AI agents — hijacks them through poisoned tool outputs and scores how easily they break."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ankit" }]
keywords = [
    "ai-security",
    "prompt-injection",
    "red-teaming",
    "llm-security",
    "ai-agents",
    "mcp",
    "fuzzing",
]

dependencies = [
    # LLM access — one interface for local Ollama + cloud (Groq/OpenAI)
    "litellm>=1.40",
    # Typed contracts between every agent/component
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # Proxy
    "mcp>=1.0",
    "httpx>=0.27",
    # Dedup: embeddings + approximate nearest neighbour
    "sentence-transformers>=3.0",
    "hnswlib>=0.8",
    "numpy>=1.26",
    # Observability
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "langfuse>=2.40",
    # Reporting
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
redteam = "agent_red_team.cli:app"

[project.urls]
Homepage = "https://github.com/ankitcodes001/Agent_Red_Team"
Repository = "https://github.com/ankitcodes001/Agent_Red_Team"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_red_team"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
